name: Studio

# JOVRA Studio checks (S04, docs/studio/DEVELOPING.md). Separate from the core ci.yml, which Studio never edits.
# Both jobs run on every pull request (no path filter), so either can be made a required check.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: studio-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Shared Studio contracts (spec/studio/README.md): schemas, fixtures, the Python reference, module pages and
  # fixture determinism. Python standard library only.
  studio-contracts:
    name: studio-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Validate Studio contracts and fixtures
        run: python3 scripts/spec/validate_studio.py

  # Studio media fixtures (S08, spec/studio/modules/media-fixtures.md): render every barcode source, the coherent
  # match, the B-roll and the six demo angles with ffmpeg on Ubuntu (cached by the generator's source), decode each
  # in full (every barcode, every click within one frame) and require the committed manifests to be reproduced, a
  # second machine reproducing the Mac render. Then the reader, click, label, budget and determinism tests, and the
  # check that the branch adds no media file outside the bundled demo subset. A cold render takes several minutes.
  studio-media:
    name: studio-media
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          ffmpeg -hide_banner -version | head -1
      - name: Restore rendered Studio media
        uses: actions/cache@v4
        with:
          path: .cache/media/studio
          key: studio-media-${{ runner.os }}-${{ hashFiles('scripts/media/**/*.py', 'spec/fixtures/sample/media-manifest.json', 'spec/fixtures/sample/jon-vs-alex.points.csv', 'spec/fixtures/sample/jon-vs-alex.session.json') }}
      - name: Render Studio media and check every file against its committed manifest
        run: python3 scripts/media/studio/render_studio.py --check
      - name: Reader, clicks, labels, demo budget and determinism tests
        run: python3 -m unittest discover -s scripts/media/studio -p 'test_*.py' -v
      # S58 (spec/studio/modules/multiangle-generator.md): render every camera of the multi-angle rig (coded and clean),
      # decode each in full and require the committed ground truth to reproduce; then recover every coded frame's match
      # time from its barcode and the ground truth alone, and run the mutation and two-run tests.
      - name: Render the multi-angle fixtures and check them against their committed ground truth
        run: python3 scripts/media/studio/multiangle/generate.py --check
      - name: Recover every frame's match time from embedded ids and the ground truth
        run: python3 scripts/media/studio/multiangle/recover.py
      - name: Multi-angle ground-truth, recovery-mutation and two-run tests
        run: python3 -m unittest discover -s scripts/media/studio/multiangle -p 'test_*.py' -v
      - name: No media file added outside the bundled demo subset
        if: github.event_name == 'pull_request'
        run: python3 scripts/media/studio/check_added_binaries.py --base ${{ github.event.pull_request.base.sha }}

  # The Foundation-only Studio domain layer builds and passes its tests on Linux, so it can never depend on an
  # Apple-only framework (the same rule as the core jovra-core job, ADR-0006).
  jovra-studio-core:
    name: jovra-studio-core
    runs-on: ubuntu-latest
    container: swift:6.1
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: No Apple-only imports in JovraStudioCore
        run: |
          if grep -rnE "import (AVFoundation|UIKit|SwiftUI)" ios/Packages/JovraStudioCore; then
            echo "JovraStudioCore must stay Foundation-only" >&2
            exit 1
          fi
      - name: swift test (JovraStudioCore)
        working-directory: ios/Packages/JovraStudioCore
        run: swift test
