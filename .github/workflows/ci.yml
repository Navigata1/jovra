name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Required check (ADR-0006): the Foundation-only domain layer builds and passes its tests on Linux.
  jovra-core:
    name: jovra-core
    runs-on: ubuntu-latest
    container: swift:6.1
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Bundled CSV contracts match shared contracts
        run: |
          cmp spec/contracts/csv/points.v1.json ios/Packages/JovraCore/Sources/JovraCore/Export/Contracts/points.v1.json
          cmp spec/contracts/csv/stats.v1.json ios/Packages/JovraCore/Sources/JovraCore/Export/Contracts/stats.v1.json
      - name: swift test (JovraCore)
        working-directory: ios/Packages/JovraCore
        env:
          JOVRA_DATA_EXPORT_OUTPUT_DIR: ${{ runner.temp }}/jovra-data-export
        run: swift test
      - name: Preserve native session JSON export
        uses: actions/upload-artifact@v4
        with:
          name: native-data-export
          path: ${{ runner.temp }}/jovra-data-export
          if-no-files-found: error

  native-data-export:
    name: native-data-export
    needs: jovra-core
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-data-export
          path: ${{ runner.temp }}/jovra-data-export
      - name: Independently validate native session export
        run: python3 scripts/spec/validate.py --encoded-dir "${{ runner.temp }}/jovra-data-export"

  # Shared contracts (spec/README.md): fixtures regenerate byte-for-byte, every document validates and the
  # engine re-run agrees, and the contract tooling's own tests pass. Python standard library only.
  spec:
    name: spec
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate fixtures (must not change a byte)
        run: |
          python3 spec/reference/generate_fixtures.py
          git status --porcelain spec
          test -z "$(git status --porcelain spec)"
      - name: Validate contracts and fixtures
        run: python3 scripts/spec/validate.py
      - name: Contract tooling tests
        run: python3 -m unittest discover -s scripts/spec -p 'test_*.py' -v
      # Studio and Room reuse scripts/spec/jsonschema_subset.py, so a checker change must keep them green too.
      - name: Validate Studio contracts
        run: python3 scripts/spec/validate_studio.py
      - name: Validate Room contracts
        run: python3 scripts/spec/validate_room.py
  # Localization and copy checks (T06): the tools' own negative tests, the literal-string lint, the
  # copy lint over every String Catalog and, on pull requests, the String Catalog ownership check.
  l10n:
    name: l10n
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Localization checks
        env:
          BRANCH: ${{ github.head_ref }}
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: scripts/l10n/check.sh

  # Media fixtures (T10): render every clip with ffmpeg on Ubuntu (cached by the renderer's hash), decode it
  # back and require each clip's decoded-frame signature hash and ground truth to equal the committed files,
  # then validate the shared contracts, including ground truth and benchmark records (re-scored in Python).
  media-fixtures:
    name: media-fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          ffmpeg -hide_banner -version | head -1
      - name: Restore rendered media
        uses: actions/cache@v4
        with:
          path: .cache/media
          key: media-${{ runner.os }}-${{ hashFiles('scripts/media/**/*.py') }}
      - name: Render media fixtures and check decoded-frame hashes
        run: python3 scripts/media/render.py --check
      - name: Validate contracts (schemas, ground truth, benchmark records)
        run: python3 scripts/spec/validate.py

  # Manual only: macOS minutes on a private repo are scarce (ADR-0006). Simulator UI suites run on
  # the build Mac and their evidence is attached to the PR instead.
  ios-app:
    name: ios-app (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Render media fixtures (JovraMedia tests read them)
        run: |
          brew install ffmpeg
          python3 scripts/media/render.py --check
      - name: swift test (JovraCore, JovraMedia)
        run: |
          swift test --package-path ios/Packages/JovraCore
          swift test --package-path ios/Packages/JovraMedia
      - name: Generate project
        run: xcodegen generate --spec ios/project.yml --project ios
      - name: Build app and run JovraTests
        run: |
          SIM_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")))')"
          xcodebuild test \
            -project ios/Jovra.xcodeproj \
            -scheme Jovra \
            -only-testing:JovraTests \
            -destination "id=$SIM_ID" \
            -derivedDataPath .derivedData \
            CODE_SIGNING_ALLOWED=NO
