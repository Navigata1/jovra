# XcodeGen spec. Generate with scripts/ios/generate.sh; never commit Jovra.xcodeproj (ADR-0005).
name: Jovra
options:
  bundleIdPrefix: com.islanddevcrew
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEVELOPMENT_TEAM: ""
packages:
  JovraCore:
    path: Packages/JovraCore
  JovraMedia:
    path: Packages/JovraMedia
targets:
  Jovra:
    type: application
    platform: iOS
    sources:
      - path: Jovra
    dependencies:
      - package: JovraCore
      - package: JovraMedia
    info:
      path: Jovra/Resources/Info.plist
      properties:
        CFBundleDisplayName: JOVRA
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: "JOVRA uses the camera to record your tennis sessions. Videos are saved on this device."
        NSMicrophoneUsageDescription: "Optional. JOVRA can use the microphone to capture audio for hit detection and voice notes. Recording works without it."
        NSPhotoLibraryAddUsageDescription: "JOVRA saves clips and exports you choose to your photo library."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.islanddevcrew.jovra
        PRODUCT_NAME: Jovra
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
  JovraTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: JovraTests
    dependencies:
      - target: Jovra
      - package: JovraCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.islanddevcrew.jovra.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Jovra.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Jovra
        BUNDLE_LOADER: $(TEST_HOST)
  JovraUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: JovraUITests
    dependencies:
      - target: Jovra
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.islanddevcrew.jovra.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Jovra
schemes:
  Jovra:
    build:
      targets:
        Jovra: all
        JovraTests: [test]
        JovraUITests: [test]
    test:
      gatherCoverageData: true
      targets:
        - JovraTests
        - JovraUITests
